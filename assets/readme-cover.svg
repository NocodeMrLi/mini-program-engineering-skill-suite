<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mini Program Engineering Skill Suite</title>
  <desc id="desc">A dark technical README cover showing a mini-program engineering workflow with nine evidence gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.46" stop-color="#18232c"/>
      <stop offset="1" stop-color="#f5f7f8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#d7dde3" stop-opacity="0.84"/>
