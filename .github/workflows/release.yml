name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package, for example v1.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build verified release package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          # Release classification compares the candidate with the preceding
          # tag. A depth-1 checkout turns the candidate into a grafted root and
          # silently destroys that baseline.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: release
        env:
          # Never interpolate dispatch inputs into the script body: the tag is
          # attacker-shaped text and ${{ }} insertion happens BEFORE bash parses
          # any validation (command injection via v"; cmd; # forms).
          RAW_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="$RAW_TAG_INPUT"
          # Strict whole-variable match. [[ =~ ]] anchors to the ENTIRE string,
          # so multi-line inputs (v1.2.3 + newline + INJECTED=1) that slip past
          # line-oriented matching are rejected; CR/LF refused explicitly.
          if [[ "$release_tag" == *$'\n'* || "$release_tag" == *$'\r'* ]]; then
            echo "Release tag must be a single line; input rejected" >&2
            exit 1
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v<major>.<minor>.<patch>; input rejected" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Run release gates
        env:
          RESOLVED_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Gating logic lives in scripts/release_gate.sh so it has committed
          # regression tests (tests/test_release_gate.py); the summary is written
          # outside the tree because export_public_package.py scans fail-closed.
          bash scripts/release_gate.sh . /tmp/unittest.log /tmp/gate-summary.json "$RESOLVED_TAG"

      - name: Upload gate summary (even on failure)
        # The gate writes its summary even when it blocks the release (that is
        # the evidence of WHICH gate stopped it). Without an always() upload the
        # file dies with the runner on failure; this step keeps the trail.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-summary
          path: /tmp/gate-summary.json
          if-no-files-found: ignore

      - name: Export public package
        env:
          # Sanitized by the resolve step's strict regex; still routed via env
          # so no expression is ever interpolated into a script body.
          RESOLVED_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(cat VERSION)"
          tag="$RESOLVED_TAG"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match VERSION $version" >&2
            exit 1
          fi
          dist_dir="$(pwd)/dist"
          export_dir="$(mktemp -d)"
          package_name="mini-program-engineering-suite-$tag"
          mkdir -p "$dist_dir"
          python3 scripts/export_public_package.py . --output "$export_dir/$package_name"
          python3 "$export_dir/$package_name/scripts/verify_public_package.py" "$export_dir/$package_name"
          cp /tmp/gate-summary.json "$dist_dir/gate-summary.json"
          cp "$export_dir/$package_name/package-manifest.json" "$dist_dir/package-manifest.json"
          # Reproducible archive (audit P1-03): fixed mtime/owner/permissions and
          # gzip -n (no timestamp) so two clean builds of one commit hash equal.
          # tar's --sort=name makes member order filesystem-independent.
          tar -C "$export_dir" \
            --sort=name \
            --mtime="@0" \
            --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -cf - "$package_name" \
            | gzip -n -9 > "$dist_dir/$package_name.tar.gz"
          cd "$dist_dir"
          # The gate summary is formal governance evidence: it must be covered
          # by SHA256SUMS like the archive and manifest (audit P1-03).
          sha256sum "$package_name.tar.gz" package-manifest.json gate-summary.json > SHA256SUMS

      - name: Verify release is not already published (immutable releases)
        # Audit P1-03: a same-tag re-release used to replace assets. Releases
        # must be immutable — a second publish of one tag fails BEFORE upload.
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag="$RESOLVED_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; releases are immutable and cannot be overwritten." >&2
            echo "Bump VERSION and cut a new tag instead of republishing." >&2
            exit 1
          fi
          echo "No existing release for $tag; proceeding."

      - name: Create draft, attach all assets, then publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag="$RESOLVED_TAG"
          notes_file="$(mktemp)"
          # Gate numbers below are quoted from dist/gate-summary.json (produced by
          # the gates step in this same run) — never typed from memory.
          gate_tests="$(python3 -c 'import json; print(json.load(open("dist/gate-summary.json"))["tests_passed"])')"
          gate_files="$(python3 -c 'import json; print(json.load(open("dist/gate-summary.json"))["validate_checked_files"])')"
          gate_semver="$(python3 -c 'import json; d=json.load(open("dist/gate-summary.json")); print("{}/{}".format(d.get("semver_bump"), d.get("required_level")))')"
          gate_eval="$(python3 -c 'import json; d=json.load(open("dist/gate-summary.json")).get("evaluation_gate") or {}; print("{}:{}".format(d.get("verdict"), d.get("mode")))')"
          {
            echo "Verified public package for $tag."
            echo
            echo "Gate summary (measured by this run):"
            echo "- tests passed: $gate_tests"
            echo "- validated public files: $gate_files"
            echo "- sensitive-scan findings: 0"
            echo "- semver bump / required level: $gate_semver"
            echo "- evaluation gate: $gate_eval"
            echo
            echo "Assets:"
            echo "- mini-program-engineering-suite-$tag.tar.gz"
            echo "- package-manifest.json"
            echo "- SHA256SUMS"
            echo "- gate-summary.json"
            echo
            echo "Integrity check:"
            echo '```bash'
            echo "sha256sum -c SHA256SUMS"
            echo "python3 mini-program-engineering-suite-$tag/scripts/verify_public_package.py mini-program-engineering-suite-$tag"
            echo '```'
          } > "$notes_file"
          # Immutable release best practice: all assets are attached while the
          # release is a draft; publication locks both tag and assets. There is
          # no upload/update/clobber path for an already published release.
          gh release create "$tag" dist/* --draft --title "$tag" --notes-file "$notes_file"
          gh release edit "$tag" --draft=false

      - name: Verify published release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN can read the published Release but GitHub rejects the
          # owner-only repository immutable-settings endpoint with HTTP 403.
          # A published Release reports immutable=true only when repository
          # immutable releases are enabled and publication has locked it.
          release_state="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RESOLVED_TAG" --jq '.immutable')"
          if [ "$release_state" != "true" ]; then
            echo "Immutable release verification failed: release=$release_state" >&2
            exit 1
          fi
          echo "Immutable release verified: $RESOLVED_TAG"
