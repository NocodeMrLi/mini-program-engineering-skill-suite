name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package, for example v1.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build verified release package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          case "$release_tag" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Run release gates
        run: |
          set -uo pipefail
          # The summary is written to /tmp first: export_public_package.py scans the
          # source tree fail-closed, so any artifact left in the tree (dist/ included)
          # would be rejected as an allowlist violation. It is copied into dist only
          # after the export succeeds.
          # gate-summary.json records what the gates ACTUALLY produced (test count,
          # checked files, scan findings). Release claims must quote these numbers;
          # filling them from memory caused four consecutive versions of undercounted
          # test totals (117/119, 117/119, 120/122, 120/122).
          python3 -m unittest discover -s tests -q 2>&1 | tee /tmp/unittest.log
          test_count="$(grep -Eo 'Ran [0-9]+ tests' /tmp/unittest.log | grep -Eo '[0-9]+' | head -1)"
          validate_json="$(python3 scripts/validate_suite.py .)"
          scan_json="$(python3 scripts/scan_sensitive_content.py . --format json)"
          python3 - "$test_count" "$validate_json" "$scan_json" <<'PYEOF'
          import json, sys
          from datetime import datetime, timezone
          test_count = int(sys.argv[1])
          validate = json.loads(sys.argv[2])
          scan = json.loads(sys.argv[3])
          summary = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"),
              "tests_passed": test_count,
              "validate_valid": validate["valid"],
              "validate_checked_files": validate["checked_files"],
              "skill_count": validate["skill_count"],
              "scan_candidate_count": scan["candidate_count"],
              "scan_finding_count": scan["finding_count"],
          }
          with open("/tmp/gate-summary.json", "w", encoding="utf-8") as handle:
              json.dump(summary, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(summary, ensure_ascii=False))
          if not validate["valid"] or scan["finding_count"]:
              sys.exit(1)
          PYEOF

      - name: Export public package
        run: |
          version="$(cat VERSION)"
          tag="${{ steps.release.outputs.tag }}"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match VERSION $version" >&2
            exit 1
          fi
          dist_dir="$(pwd)/dist"
          export_dir="$(mktemp -d)"
          package_name="mini-program-engineering-suite-$tag"
          mkdir -p "$dist_dir"
          python3 scripts/export_public_package.py . --output "$export_dir/$package_name"
          python3 "$export_dir/$package_name/scripts/verify_public_package.py" "$export_dir/$package_name"
          cp /tmp/gate-summary.json "$dist_dir/gate-summary.json"
          cp "$export_dir/$package_name/package-manifest.json" "$dist_dir/package-manifest.json"
          tar -C "$export_dir" -czf "$dist_dir/$package_name.tar.gz" "$package_name"
          cd "$dist_dir"
          sha256sum "$package_name.tar.gz" package-manifest.json > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          notes_file="$(mktemp)"
          # Gate numbers below are quoted from dist/gate-summary.json (produced by
          # the gates step in this same run) — never typed from memory.
          gate_tests="$(python3 -c 'import json; print(json.load(open("dist/gate-summary.json"))["tests_passed"])')"
          gate_files="$(python3 -c 'import json; print(json.load(open("dist/gate-summary.json"))["validate_checked_files"])')"
          {
            echo "Verified public package for $tag."
            echo
            echo "Gate summary (measured by this run):"
            echo "- tests passed: $gate_tests"
            echo "- validated public files: $gate_files"
            echo "- sensitive-scan findings: 0"
            echo
            echo "Assets:"
            echo "- mini-program-engineering-suite-$tag.tar.gz"
            echo "- package-manifest.json"
            echo "- SHA256SUMS"
            echo "- gate-summary.json"
            echo
            echo "Integrity check:"
            echo '```bash'
            echo "sha256sum -c SHA256SUMS"
            echo "python3 mini-program-engineering-suite-$tag/scripts/verify_public_package.py mini-program-engineering-suite-$tag"
            echo '```'
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes-file "$notes_file"
          fi
