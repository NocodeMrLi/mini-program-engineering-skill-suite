name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package, for example v1.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build verified release package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          case "$release_tag" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Run release gates
        run: |
          set -euo pipefail
          # Gating logic lives in scripts/release_gate.sh so it has committed
          # regression tests (tests/test_release_gate.py); the summary is written
          # outside the tree because export_public_package.py scans fail-closed.
          bash scripts/release_gate.sh . /tmp/unittest.log /tmp/gate-summary.json

      - name: Upload gate summary (even on failure)
        # The gate writes its summary even when it blocks the release (that is
        # the evidence of WHICH gate stopped it). Without an always() upload the
        # file dies with the runner on failure; this step keeps the trail.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-summary
          path: /tmp/gate-summary.json
          if-no-files-found: ignore

      - name: Export public package
        run: |
          version="$(cat VERSION)"
          tag="${{ steps.release.outputs.tag }}"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match VERSION $version" >&2
            exit 1
          fi
          dist_dir="$(pwd)/dist"
          export_dir="$(mktemp -d)"
          package_name="mini-program-engineering-suite-$tag"
          mkdir -p "$dist_dir"
          python3 scripts/export_public_package.py . --output "$export_dir/$package_name"
          python3 "$export_dir/$package_name/scripts/verify_public_package.py" "$export_dir/$package_name"
          cp /tmp/gate-summary.json "$dist_dir/gate-summary.json"
          cp "$export_dir/$package_name/package-manifest.json" "$dist_dir/package-manifest.json"
          tar -C "$export_dir" -czf "$dist_dir/$package_name.tar.gz" "$package_name"
          cd "$dist_dir"
          sha256sum "$package_name.tar.gz" package-manifest.json > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          notes_file="$(mktemp)"
          # Gate numbers below are quoted from dist/gate-summary.json (produced by
          # the gates step in this same run) — never typed from memory.
          gate_tests="$(python3 -c 'import json; print(json.load(open("dist/gate-summary.json"))["tests_passed"])')"
          gate_files="$(python3 -c 'import json; print(json.load(open("dist/gate-summary.json"))["validate_checked_files"])')"
          {
            echo "Verified public package for $tag."
            echo
            echo "Gate summary (measured by this run):"
            echo "- tests passed: $gate_tests"
            echo "- validated public files: $gate_files"
            echo "- sensitive-scan findings: 0"
            echo
            echo "Assets:"
            echo "- mini-program-engineering-suite-$tag.tar.gz"
            echo "- package-manifest.json"
            echo "- SHA256SUMS"
            echo "- gate-summary.json"
            echo
            echo "Integrity check:"
            echo '```bash'
            echo "sha256sum -c SHA256SUMS"
            echo "python3 mini-program-engineering-suite-$tag/scripts/verify_public_package.py mini-program-engineering-suite-$tag"
            echo '```'
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes-file "$notes_file"
          fi
