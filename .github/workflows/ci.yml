name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify public skill suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -q

      - name: Validate suite structure
        run: python3 scripts/validate_suite.py .

      - name: Check README translation structure
        run: python3 scripts/check_i18n_readme_structure.py .

      - name: Scan sensitive content
        run: python3 scripts/scan_sensitive_content.py . --format json

      - name: Export and verify public package
        run: |
          export_dir="$(mktemp -d)"
          python3 scripts/export_public_package.py . --output "$export_dir/package"
          python3 "$export_dir/package/scripts/verify_public_package.py" "$export_dir/package"
