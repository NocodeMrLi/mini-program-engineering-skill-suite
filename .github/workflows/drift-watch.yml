name: Drift watch

# Weekly platform-rule freshness pipeline (decided by the author):
# Saturdays 02:00 UTC = Beijing Saturday 10:00, inside the DeepSeek weekend
# low-price window. Stage 1 is deterministic (L0/L1, zero tokens). Stage 2 runs
# L2 extraction plus apply-ready review through the HTTP engine using the
# AGENT_API_* secrets configured by the author; without the secrets the run
# degrades to detection-only and still opens detection issues. Shadow mode is
# OFF: passing audits are applied to volatile platform facts and submitted as
# a PR with auto-merge enabled; rejected audits stay issue-only.
on:
  schedule:
    - cron: "0 2 * * 6"  # Saturdays 02:00 UTC = Beijing Saturday 10:00
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform directory to check (empty = all)"
        required: false
        default: ""
      skip-audit:
        description: "Run detection only (skip L2/review)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: drift-watch
  cancel-in-progress: false

jobs:
  detect:
    name: Detect platform rule drift (L0/L1)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run deterministic drift check
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through env, never interpolated into the script body:
          # workflow_dispatch inputs are attacker-controllable strings and
          # inline `${{ }}` insertion is a script-injection vector.
          PLATFORM_INPUT: ${{ inputs.platform }}
        run: |
          set -uo pipefail
          args=""
          if [ -n "$PLATFORM_INPUT" ]; then
            case "$PLATFORM_INPUT" in
              wechat|alipay|douyin) args="--platform-dir platforms/$PLATFORM_INPUT" ;;
              *) echo "Unknown platform: $PLATFORM_INPUT" >&2; exit 2 ;;
            esac
          fi
          # --no-llm keeps detection on the deterministic path (L0/L1 only);
          # --emit-issues keeps the notification chain intact even when the
          # audit stage below is skipped (no credentials or skip-audit).
          mkdir -p "$RUNNER_TEMP/drift-watch"
          python3 scripts/drift_watch.py $args --no-llm --output "$RUNNER_TEMP/drift-watch/drift-report.json" --emit-issues

      - name: Upload drift report
        # Detection fails (rc=1) exactly when drift is actionable — that is
        # when the audit stage needs this artifact most. Always upload.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-report
          path: ${{ runner.temp }}/drift-watch/drift-report.json
          if-no-files-found: warn

  audit:
    name: L2 extraction and auto-merge review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect
    # Run after detect EVEN WHEN detect failed: detect fails precisely when
    # drift is actionable, and that is when the audit (L2 + verdict) matters.
    # `inputs.*` keeps the declared boolean type; `github.event.inputs.*`
    # stringifies it, and string-vs-boolean comparison is always true (that
    # bug made skip-audit impossible to enable for real).
    if: ${{ !cancelled() && inputs.skip-audit != true && needs.detect.result != 'skipped' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # drift_audit emits the current release recommendation. It needs the
          # preceding tags and commits rather than a depth-1 grafted root.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download drift report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: drift-report
          path: ${{ runner.temp }}/drift-watch

      # The secrets context is NOT allowed in step-level if: expressions
      # (GitHub rejects the whole workflow with 422), so the credential check
      # happens inside the shell: audit runs when the key env is non-empty and
      # degrades with a clear message otherwise.
      - name: Run audit (L2 + apply-ready review, verdict issues)
        env:
          AGENT_API_BASE_URL: ${{ secrets.AGENT_API_BASE_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_API_MODEL: ${{ secrets.AGENT_API_MODEL }}
          EVAL_ENGINE: http
          GH_TOKEN: ${{ github.token }}
          PLATFORM_INPUT: ${{ inputs.platform }}
        run: |
          set -uo pipefail
          if [ -z "$AGENT_API_KEY" ]; then
            echo "AGENT_API_* secrets not configured; skipping cloud audit."
            echo "The detect job already opened detection issues for actionable drift; run L2 locally per issue instructions."
            exit 0
          fi
          args=""
          if [ -n "$PLATFORM_INPUT" ]; then
            case "$PLATFORM_INPUT" in
              wechat|alipay|douyin) args="--platform-dir platforms/$PLATFORM_INPUT" ;;
              *) echo "Unknown platform: $PLATFORM_INPUT" >&2; exit 2 ;;
            esac
          fi
          # --report bounds the audit to the platforms the detect job scanned;
          # manual-only layers are skipped inside drift_audit either way.
          mkdir -p "$RUNNER_TEMP/drift-watch/audit-out"
          python3 scripts/drift_audit.py $args --report "$RUNNER_TEMP/drift-watch/drift-report.json" --rounds 3 --out-dir "$RUNNER_TEMP/drift-watch/audit-out" --emit-issues
          # emit-issues reports its own outcome; a structured summary on disk
          # is the durable fallback when issue creation fails (P2 audit trail).
          if [ ! -f "$RUNNER_TEMP/drift-watch/audit-out/audit-summary.json" ]; then
            echo "audit-summary.json missing after audit run" >&2
            exit 1
          fi

      - name: Apply approved drift proposals
        id: apply
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          proposals=("$RUNNER_TEMP"/drift-watch/audit-out/*-proposal.json)
          if [ ! -f "$RUNNER_TEMP/drift-watch/audit-out/audit-summary.json" ] || [ "${#proposals[@]}" -eq 0 ]; then
            echo "applied=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/apply_drift_proposal.py \
            --audit-summary "$RUNNER_TEMP/drift-watch/audit-out/audit-summary.json" \
            --out "$RUNNER_TEMP/drift-watch/audit-out/apply-summary.json" \
            "${proposals[@]}"
          applied="$(python3 - <<'PY'
          import json
          import os
          path = os.path.join(os.environ["RUNNER_TEMP"], "drift-watch", "audit-out", "apply-summary.json")
          print(json.load(open(path, encoding="utf-8")).get("applied_count", 0))
          PY
          )"
          echo "applied=$applied" >> "$GITHUB_OUTPUT"

      - name: Validate applied drift update
        if: steps.apply.outputs.applied != '0'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -q
          python3 scripts/validate_suite.py .
          python3 scripts/check_i18n_readme_structure.py .
          python3 scripts/scan_sensitive_content.py . --format json

      - name: Submit drift update PR and enable auto-merge
        if: steps.apply.outputs.applied != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="codex/drift-auto-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add platforms
          git commit -m "chore: apply approved platform drift facts"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: apply approved platform drift facts" \
            --body "Automated Saturday drift audit applied only PROPOSAL_CONSISTENT_WITH_EXTRACTION facts.md updates. CI must pass before merge.")"
          gh pr merge "$pr_url" --squash --auto --delete-branch

      - name: Upload audit output (always)
        # Structured verdict trail: survives even when issue creation fails or
        # the audit step above exits non-zero on actionable drift.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-out
          path: ${{ runner.temp }}/drift-watch/audit-out
          if-no-files-found: ignore
