name: Drift watch

# Weekly platform-rule freshness pipeline (decided by the author):
# Saturdays 02:00 UTC = Beijing Saturday 10:00, inside the DeepSeek weekend
# low-price window. Stage 1 is deterministic (L0/L1, zero tokens). Stage 2 runs
# L2 extraction plus shadow-mode review through the HTTP engine using the
# AGENT_API_* secrets configured by the author; without the secrets the run
# degrades to detection-only and still opens detection issues. Shadow mode is
# ON: verdicts are reported on issues, nothing merges automatically.
on:
  schedule:
    - cron: "0 2 * * 6"  # Saturdays 02:00 UTC = Beijing Saturday 10:00
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform directory to check (empty = all)"
        required: false
        default: ""
      skip-audit:
        description: "Run detection only (skip L2/review)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-watch
  cancel-in-progress: false

jobs:
  detect:
    name: Detect platform rule drift (L0/L1)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Run deterministic drift check
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through env, never interpolated into the script body:
          # workflow_dispatch inputs are attacker-controllable strings and
          # inline `${{ }}` insertion is a script-injection vector.
          PLATFORM_INPUT: ${{ inputs.platform }}
        run: |
          set -uo pipefail
          args=""
          if [ -n "$PLATFORM_INPUT" ]; then
            case "$PLATFORM_INPUT" in
              wechat|alipay|douyin) args="--platform-dir platforms/$PLATFORM_INPUT" ;;
              *) echo "Unknown platform: $PLATFORM_INPUT" >&2; exit 2 ;;
            esac
          fi
          # --no-llm keeps detection on the deterministic path (L0/L1 only);
          # --emit-issues keeps the notification chain intact even when the
          # audit stage below is skipped (no credentials or skip-audit).
          python3 scripts/drift_watch.py $args --no-llm --output drift-report.json --emit-issues

      - name: Upload drift report
        # Detection fails (rc=1) exactly when drift is actionable — that is
        # when the audit stage needs this artifact most. Always upload.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.json
          if-no-files-found: warn

  audit:
    name: L2 extraction and shadow-mode review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect
    # Run after detect EVEN WHEN detect failed: detect fails precisely when
    # drift is actionable, and that is when the audit (L2 + verdict) matters.
    # `inputs.*` keeps the declared boolean type; `github.event.inputs.*`
    # stringifies it, and string-vs-boolean comparison is always true (that
    # bug made skip-audit impossible to enable for real).
    if: ${{ !cancelled() && inputs.skip-audit != true && needs.detect.result != 'skipped' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Download drift report
        uses: actions/download-artifact@v4
        with:
          name: drift-report

      # The secrets context is NOT allowed in step-level if: expressions
      # (GitHub rejects the whole workflow with 422), so the credential check
      # happens inside the shell: audit runs when the key env is non-empty and
      # degrades with a clear message otherwise.
      - name: Run audit (L2 + shadow-mode review, verdict issues)
        env:
          AGENT_API_BASE_URL: ${{ secrets.AGENT_API_BASE_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_API_MODEL: ${{ secrets.AGENT_API_MODEL }}
          EVAL_ENGINE: http
          GH_TOKEN: ${{ github.token }}
          PLATFORM_INPUT: ${{ inputs.platform }}
        run: |
          set -uo pipefail
          if [ -z "$AGENT_API_KEY" ]; then
            echo "AGENT_API_* secrets not configured; skipping cloud audit."
            echo "The detect job already opened detection issues for actionable drift; run L2 locally per issue instructions."
            exit 0
          fi
          args=""
          if [ -n "$PLATFORM_INPUT" ]; then
            case "$PLATFORM_INPUT" in
              wechat|alipay|douyin) args="--platform-dir platforms/$PLATFORM_INPUT" ;;
              *) echo "Unknown platform: $PLATFORM_INPUT" >&2; exit 2 ;;
            esac
          fi
          # --report bounds the audit to the platforms the detect job scanned;
          # manual-only layers are skipped inside drift_audit either way.
          python3 scripts/drift_audit.py $args --report drift-report.json --rounds 3 --out-dir audit-out --emit-issues
          # emit-issues reports its own outcome; a structured summary on disk
          # is the durable fallback when issue creation fails (P2 audit trail).
          if [ ! -f audit-out/audit-summary.json ]; then
            echo "audit-summary.json missing after audit run" >&2
            exit 1
          fi

      - name: Upload audit output (always)
        # Structured verdict trail: survives even when issue creation fails or
        # the audit step above exits non-zero on actionable drift.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-out
          path: audit-out
          if-no-files-found: ignore
